services:
  postgres:
    image: postgres:17-alpine
    container_name: email-manager-db
    environment:
      POSTGRES_USER: email_manager
      POSTGRES_PASSWORD: email_manager
      POSTGRES_DB: email_manager
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

name: Email Manager

on:
  # Run every 3 hours
  schedule:
    - cron: '0 */3 * * *'
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  check-emails:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create config from secrets
      run: |
        cat > config.py << 'EOF'
        # Auto-generated config from GitHub Secrets
        GMAIL_EMAIL = "${{ secrets.GMAIL_EMAIL }}"
        GMAIL_APP_PASSWORD = "${{ secrets.GMAIL_APP_PASSWORD }}"
        TELEGRAM_BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
        TELEGRAM_CHAT_ID = "${{ secrets.TELEGRAM_CHAT_ID }}"
        GROQ_API_KEY = "${{ secrets.GROQ_API_KEY }}"
        USE_AI_CLASSIFICATION = ${{ secrets.USE_AI_CLASSIFICATION || 'False' }}
        CHECK_INTERVAL_HOURS = 3
        IMAP_SERVER = "imap.gmail.com"
        IMAP_PORT = 993
        
        ALWAYS_IGNORE_DOMAINS = [
            'pinterest.com',
            'discover.pinterest.com',
            'prezi.com',
            'noreply',
            'no-reply',
            'notifications@',
            'invitations@linkedin.com',
            'jobs-listings@linkedin.com',
            'recommendations@',
            'hello@pysource.com',
            'laravel.com',
            'youversion.com',
            'mail.beehiiv.com',
            'substack.com',
        ]
        
        ALWAYS_IGNORE_KEYWORDS = [
            'unsubscribe',
            'newsletter',
            'promotion',
            'marketing',
            'discount',
            'sale',
            'advent calendar',
            'giving tuesday',
            'double your impact',
            'oss credits',
            'product updates',
            'weekly digest',
            'daily digest',
        ]
        
        ALWAYS_IMPORTANT_PATTERNS = [
            're:',
            'fwd:',
            'invitation à collaborer',
            'github',
            'pull request',
            'code review',
            'vous a mentionné',
            'vous a assigné',
        ]
        EOF
        
    - name: Check emails
      run: |
        # Run once and exit (no infinite loop)
        timeout 300 python email_manager.py || true
        
    - name: Upload logs (if exists)
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: email-manager-logs
        path: '*.log'
        if-no-files-found: ignore

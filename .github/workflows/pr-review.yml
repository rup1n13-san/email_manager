name: PR Review with Progress Tracking

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review-with-tracking:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review with the following strict focus areas based on our AGENTS.md and project rules:

            1. **Readability & Maintainability (Highest Priority)**
               - Code MUST be crystal clear. Reject functions with hundreds of lines of code.
               - Ensure functions are concise and single-purpose.
               - Can a junior read this without explanation? If not, demand simplification.
               - Would a senior engineer approve this without a comment?

            2. **Code Structure & Visualization**
               - Analyze and visualize the flow of the code in your review.
               - Map out which services call which helpers, and how the components interact to attain the goal.
               - Ensure the architecture respects the existing layered approach.

            3. **Simplicity (Prevent Over-engineering)**
               - Look for overkill or over-engineering.
               - If there is a simpler solution to achieve the same result, propose it immediately.
               - Cut complexity built for future cases that don't exist yet.

            4. **Security & Validation**
               - Check for potential security vulnerabilities.
               - Validate input sanitization and schema discipline.
               - Ensure OAuth tokens remain encrypted at rest and no sensitive data is logged.

            5. **Project Constraints (AGENTS.md)**
               - Enforce ESM `.js` imports.
               - Ensure API responses use the standard `{ success: boolean, data: T }` envelope.
               - Ensure ULID is used for all primary keys.
               - Verify no IMAP or third-party Telegram bot frameworks are introduced.

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations, architectural visualization, or praise.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🤖 PR Review Completed!
            Repository: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            Status: ${{ job.status }}

            View PR: ${{ github.event.pull_request.html_url }}
